name: validate-week-one

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          python -m pip install --disable-pip-version-check cfn-lint
      - name: Run tests and static validation
        run: make validate
